# The dromas command's releases (AGENTS.md § Releases), on a pushed tag v*:
# - tag: the tag must be signed by a key in .github/allowed_signers, checked
#   with git verify-tag as Caddy checks its own;
# - ci: the whole of ci.yml runs on the tagged commit;
# - release: GoReleaser builds it (.goreleaser.yaml) and publishes the
#   archives and Linux packages, an SBOM of each archive and checksums.txt, signed with cosign, as the
#   tag's GitHub release, and every file the checksums name is attested;
#   opens the winget pull request for the Windows zips, commits the Nix
#   package, and pushes the AUR package;
# - verify: the published release is checked as README § Check a download has a user
#   check it, as GoReleaser checks its own;
# - rebuild: the release is built again from its tag on another image, and
#   each archive and package must come out as the release job made it, which
#   verify has checked against what was published; the .deb is installed and
#   its systemd unit verified.
# By hand (workflow_dispatch), all of it but the tag and verify, on main as a
# snapshot published nowhere: so a release's every build and test runs
# before any tag is made. Actions are
# pinned by commit, each with its release beside it, and GoReleaser by its
# version.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}
  REPO: ${{ github.repository }}

jobs:
  tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag's signature
        # Checkout can leave the tag a lightweight ref to its commit
        # (actions/checkout#290), so it is fetched again as pushed. A tag that
        # is lightweight, unsigned, or signed by a key the file does not name
        # for git fails here.
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$TAG"

  ci:
    needs: tag
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [tag, ci]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The environment winget holds WINGET_GITHUB_TOKEN and deploys from a v*
    # tag alone, so no branch, hand-run or pull request reads it; a hand-run
    # takes no environment.
    environment: ${{ github.ref_type == 'tag' && 'winget' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      go: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag as pushed
        # For its message, which heads the release's notes (.goreleaser.yaml).
        if: github.ref_type == 'tag'
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: stable
          check-latest: true
          # No cache in the job that builds and signs a release: a cache another
          # run on the repo saved is no input of a signed build (zizmor's
          # cache-poisoning audit, a cache read in a release workflow; read 2026-11-08).
          cache: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: ${{ github.ref_type == 'tag' && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The classic token that opens the winget pull request and commits
          # the Nix package (.goreleaser.yaml § winget, § nix), the
          # environment winget's secret, on a tag alone: a hand-run's snapshot
          # publishes nothing and is given none.
          WINGET_GITHUB_TOKEN: ${{ github.ref_type == 'tag' && secrets.WINGET_GITHUB_TOKEN || '' }}
          # The SSH key of the maintainer's AUR account, which pushes the AUR
          # package (.goreleaser.yaml § aurs), the environment's too.
          AUR_KEY: ${{ github.ref_type == 'tag' && secrets.AUR_KEY || '' }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-checksums: ./dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt

  verify:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: the release, as a user downloads it
        run: |
          gh --version
          gh release download "$TAG" -R "$REPO" -D release
          ls -l release
      - name: checksums.txt, signed by this workflow at this tag
        working-directory: release
        run: |
          cosign verify-blob \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle checksums.txt.sigstore.json checksums.txt
          sha256sum --strict -c checksums.txt
      - name: each file's attestation, built by this workflow from this tag
        working-directory: release
        # gh prints nothing on a pass off a terminal, so each file passed is
        # named after it, and the log shows which were checked (#503 item 2);
        # a failure ends the step (bash -e) before its name is printed.
        run: |
          while read -r _ file; do
            gh attestation verify "$file" -R "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
            echo "attested: $file"
          done < checksums.txt
      - name: the release's own attestation, which GitHub makes of an immutable release
        working-directory: release
        run: |
          gh release verify "$TAG" -R "$REPO"
          for file in *; do gh release verify-asset "$TAG" "$file" -R "$REPO"; done

  rebuild:
    needs: release
    # A skipped job upstream (tag, on a hand-run) skips every job after it
    # unless the job says otherwise.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.ref_type == 'tag'
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.release.outputs.go }}
          # No cache here either: the rebuild is what a release is compared to.
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: ${{ github.ref_type == 'tag' && 'release --clean --skip=publish,sign,sbom' || 'release --snapshot --clean --skip=sign,sbom' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: published
      - name: each archive and package, as the release job made it
        # The SBOMs are left out: syft writes a new document name and time
        # each run.
        run: |
          grep -E '\.(tar\.gz|zip|deb|rpm|apk)$' published/checksums.txt | sort > published.sums
          grep -E '\.(tar\.gz|zip|deb|rpm|apk)$' dist/checksums.txt | sort > rebuilt.sums
          cat rebuilt.sums
          diff published.sums rebuilt.sums
      - name: the .deb installs, and its systemd unit verifies
        # systemd-analyze verify exits 0 on a key it does not know or a value
        # it cannot parse, and prints a line for each: so any output fails.
        run: |
          sudo apt-get install -y ./dist/dromas_*_amd64.deb
          dromas version
          out=$(systemd-analyze verify /usr/lib/systemd/user/dromas@.service 2>&1)
          printf '%s\n' "$out"
          test -z "$out"
