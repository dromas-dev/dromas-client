# The gate AGENTS.md lists before every push, run on every push to main,
# every pull request and every merge group (the merge queue's test of a pull
# request on main and those queued ahead of it, GitHub's merge_group event),
# so each commit's result is on the public record, and
# once a day, when govulncheck meets advisories published since. The fuzz
# targets run once a week, an hour each, or by hand. release.yml runs it all
# again on a release's tag before it builds (workflow_call). Actions are
# pinned by commit, each with its release beside it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "23 5 * * *"
    - cron: "47 6 * * 0" # the weekly fuzz run
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A pull request's newer push cancels its older run; every other run is its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    # Ubuntu on two OpenSSH releases for the script and the cross-tests, 9.6p1
    # and 10.2p1, and on arm64; macOS on Apple silicon, and on Intel in the
    # daily run alone, never a release's: that runner compiles from a cold
    # cache at a third of the others' speed; Windows on x64 and
    # arm64, in Git's bash: each system and architecture a release is built
    # for, the Intel Mac's tested on main once a day. On macOS and Windows
    # scripts/check.sh leaves ./sh out (its header says why).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-24.04","ubuntu-26.04","ubuntu-26.04-arm","macos-26","macos-26-intel","windows-2025","windows-11-arm"]' || '["ubuntu-24.04","ubuntu-26.04","ubuntu-26.04-arm","macos-26","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.os }}
    # Twice a run's usual length: a hang is caught sooner by scripts/check.sh's
    # timeout for one package, which prints what it waits for.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: tools
        run: |
          go version; ssh -V; jq --version; curl --version | head -1; bash --version | head -1
      - name: check
        # gofmt, vet, every test (a skip fails the job, since this runner has
        # every tool), and the race test: scripts/check.sh, which a laptop runs too.
        run: scripts/check.sh full

  windows-accounts:
    # The test job's Windows user is the built-in Administrator. Here every test
    # runs as a plain user, and the tests of what an account can do as SYSTEM,
    # NETWORK SERVICE, LOCAL SERVICE and Guest, each a process of that account
    # by a scheduled task, and as a second plain user, who tries what the first
    # one's lists say. Beside them a FAT32 and an exFAT volume, which keep no
    # access list. scripts/windows-accounts.ps1 makes these, on this runner only:
    # the tests skip without them, by DROMAS_TEST_ACCOUNT.
    name: test (windows accounts)
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      # Beside the checkout, for every account to read and write.
      GOMODCACHE: C:\dromas-accounts\mod
      GOCACHE: C:\dromas-accounts\gocache
      # The checkout is the runner user's, so git refuses the others its status.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # No Go cache here, as lint: this job would share the key of the test
          # job on this image.
          cache: false
      - name: accounts and volumes
        shell: powershell
        run: ./scripts/windows-accounts.ps1
      - name: a plain user, every test
        shell: powershell
        run: ./scripts/windows-as-account.ps1 plain full
      - name: a second plain user
        shell: powershell
        run: ./scripts/windows-as-account.ps1 other account
      - name: SYSTEM
        shell: powershell
        run: ./scripts/windows-as-account.ps1 system account
      - name: NETWORK SERVICE
        shell: powershell
        run: ./scripts/windows-as-account.ps1 network-service account
      - name: LOCAL SERVICE
        shell: powershell
        run: ./scripts/windows-as-account.ps1 local-service account
      - name: Guest
        shell: powershell
        run: ./scripts/windows-as-account.ps1 guest account

  bsd:
    # FreeBSD, OpenBSD, NetBSD and DragonFly, each in a VM on a Linux runner
    # (cross-platform-actions), each step after the VM's start run inside it
    # (cpa.sh). Go is the latest release, as setup-go's stable is elsewhere:
    # the system's packaged Go switches to it by Go's own toolchain download
    # (GOTOOLCHAIN), checked against the checksum database. scripts/check.sh
    # leaves ./sh out there (its header says why). NetBSD and DragonFly in the
    # daily run alone, never a release's, as the Intel Mac: their VMs build
    # the tests at a third and a quarter of the others' speed. The race test in
    # the daily run alone too: with no Go cache in the VM, its build takes FreeBSD
    # minutes, for seconds of tests.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '[{"name":"freebsd","version":"15.1","install":"sudo pkg install -y go bash jq"},{"name":"openbsd","version":"8.0","install":"sudo pkg_add go jq"},{"name":"netbsd","version":"11.0","install":"sudo pkgin -y install go jq bash openssh"},{"name":"dragonflybsd","version":"6.4.2","install":"sudo pkg install -y go bash jq"}]' || '[{"name":"freebsd","version":"15.1","install":"sudo pkg install -y go bash jq"},{"name":"openbsd","version":"8.0","install":"sudo pkg_add go jq"}]') }}
    name: test (${{ matrix.os.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: latest Go
        # In the job's environment, as cpa.sh forwards a variable from each
        # step's own.
        run: |
          toolchain=$(curl -fsS 'https://go.dev/dl/?mode=json' | jq -r '.[0].version')
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: ${{ matrix.os.name }}
          version: ${{ matrix.os.version }}
          shell: bash
          cpu_count: 4
          memory: 8G
          environment_variables: GOTOOLCHAIN
      - name: tools
        shell: cpa.sh {0} --environment-variables INSTALL
        env:
          INSTALL: ${{ matrix.os.install }}
        # On NetBSD, in each step, pkgsrc's bin goes first, so the cross-tests
        # meet pkgsrc's OpenSSH: the base system's ssh-keygen certifies no
        # Ed25519 key with another (NetBSD 11.0; upstream 10.3p1 does). Before
        # it, the versioned Go package's bin: pkgsrc's go is a meta package
        # that links no go command.
        run: |
          $INSTALL
          for d in /usr/pkg/bin /usr/pkg/go1*/bin; do if [ -d "$d" ]; then PATH=$d:$PATH; fi; done
          uname -a; go version; ssh -V; jq --version; bash --version | head -1
          if [ "$(go env GOVERSION)" != "$GOTOOLCHAIN" ]; then echo "::error::Go is $(go env GOVERSION), not the latest, '$GOTOOLCHAIN'"; exit 1; fi
      - name: check
        shell: cpa.sh {0}
        run: |
          for d in /usr/pkg/bin /usr/pkg/go1*/bin; do if [ -d "$d" ]; then PATH=$d:$PATH; fi; done
          scripts/check.sh ${{ github.event_name == 'schedule' && 'full' || 'norace' }}

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # No Go cache here: setup-go saves one only when its key misses, and
          # this job shares the key of the test job on this image, so it saved
          # its smaller build first and the test job never saved its own (#427).
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # No Go cache here: setup-go saves one only when its key misses, and
          # this job shares the key of the test job on this image, so it saved
          # its smaller build first and the test job never saved its own (#427).
          cache: false
      - run: scripts/check.sh vuln

  fuzz-targets:
    # The fuzz targets, listed from the code: the weekly run alone, never on a
    # push, a pull request, the daily run, a hand-run or a call from
    # release.yml (a called workflow sees its caller's event, and release.yml
    # has no schedule).
    if: github.event.schedule == '47 6 * * 0'
    runs-on: ubuntu-26.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - id: list
        run: |
          go test -list '^Fuzz' ./... | awk '/^Fuzz/ { n[++k] = $1; next } /^ok/ { for (i = 1; i <= k; i++) print $2, n[i]; k = 0 }' > "$RUNNER_TEMP/targets"
          [ -s "$RUNNER_TEMP/targets" ] || { echo "::error::no fuzz target listed"; exit 1; }
          cat "$RUNNER_TEMP/targets"
          echo "targets=$(jq -R -s -c 'split("\n") | map(select(length > 0) | split(" ") | {pkg: .[0], name: .[1]})' "$RUNNER_TEMP/targets")" >> "$GITHUB_OUTPUT"

  fuzz:
    # Each target in a job of its own, an hour, at most six at once: the org's
    # plan runs 20 jobs at a time, and a job at most six hours. From the corpus
    # earlier runs have grown.
    needs: fuzz-targets
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    name: fuzz (${{ matrix.target.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      FUZZTIME: 60m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.target.name }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target.name }}-
            fuzz-
      - name: fuzz
        env:
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz "^$NAME\$" -fuzztime "$FUZZTIME" "$PKG"
      - name: the failing input
        # go test writes it under the package's testdata/fuzz/, where a fix keeps it as a seed.
        if: failure()
        run: git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | xargs -r tail -n +1

  server:
    # dromas-server requires a release of this module; a go.work over the two
    # checkouts builds it against this commit, so a change here is a change there.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dromas-client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dromas-dev/dromas-server
          path: dromas-server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            dromas-client/go.sum
            dromas-server/go.sum
      - name: workspace
        run: go work init ./dromas-server ./dromas-client
      - name: check
        # dromas-server's own scripts/check.sh: its tests and test/interop.sh, against this commit
        working-directory: dromas-server
        run: scripts/check.sh full
