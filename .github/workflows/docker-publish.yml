# The echo mailbox's image, for linux/amd64 and linux/arm64, pushed to the
# GitHub Container Registry with an attestation of how and where it was
# built: GitHub's "Publishing Docker images" workflow, with Buildx for the
# two platforms. On every push to main, and by hand. Actions are pinned by
# commit, each with its release beside it.
name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dromas-dev/dromas-echo

jobs:
  build-and-push-image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      # The whole history and its tags: go build stamps the binaries' version
      # from them (Dockerfile), a pseudo-version above the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=dromas-echo
            org.opencontainers.image.description=The Dromas echo mailbox, a client: it answers every message that passes every check with a signed reply carrying the body back, and holds the dromas command beside it. Apache-2.0.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The image names a version, never (devel): a server's version floor
      # refuses a binary that names 0.0.0-devel (#732).
      - name: the binaries name a version
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          v=$(docker run --rm --platform linux/amd64 --entrypoint dromas "$REF" version | jq -r .version)
          echo "dromas version: $v"
          case $v in v0.*) ;; *) echo "::error::the image's dromas names $v, not a module version"; exit 1 ;; esac
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
