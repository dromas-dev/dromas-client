# Vale lints the pages people read against the Google developer documentation
# style guide (AGENTS.md § How a page is written). CI runs it (ci.yml, the vale job); run
# `vale sync` once, then `vale .`, on any box.
StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = Dromas
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip

[*.md]
BasedOnStyles = Vale, Google

# Pages written for agents, not people.
[{AGENTS.md,CLAUDE.md}]
BasedOnStyles =

# The command reference, generated from the help (TestTheCommandPagesAreTheHelp).
# The help is plain text, so a flag, a code, a duration and a TOML list, as the
# program writes them, carry no code format here: Vale skips them as tokens.
[docs/commands/*.md]
TokenIgnores = (--[a-z][a-z0-9-]*), (\b[a-z0-9]+_[a-z0-9_]*), (\b[0-9]+[smhd]\b), (\[[^]]*\])

# A record of other systems' designs, quoted and cited: not a page to style.
[PRECEDENTS.md]
BasedOnStyles =
