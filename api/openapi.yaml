    get:
      tags: [messages]
      operationId: fetch
      summary: Fetch a message
      description: |
        A message's ciphertext, and nothing else (`PROTOCOL.md` §11.12). No
        answer is `416`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: Range
          in: header
          required: false
          description: '`bytes=N-`, one open-ended byte range whose N is below the ciphertext''s length, asks for the bytes from N on (RFC 9110 §14.2; `PROTOCOL.md` §11.12). The unit `bytes` is read in any ASCII case and no other (RFC 9110 §5.6.2). Any other range, a closed one, a suffix, several or one of another unit among them, gets the whole body, `200`.'
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          description: False whatever it holds, so a `Range` beside it gets the whole body, `200` (RFC 9110 §13.1.5; `PROTOCOL.md` §11.12).
          schema:
            type: string
      responses:
        '200':
          description: The age file exactly as its sender posted it, of the `size` the list gave, to a fetch with no `Range` or one that is not `bytes=N-` with N below its length.
