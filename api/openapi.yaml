openapi: 3.1.0
info:
  title: dromas
  version: v1-pre-stable
  summary: The HTTP layer of the dromas protocol, v1, before it is declared stable.
  description: |
    The HTTP shapes of a dromas server: its routes, methods, parameters,
    request and answer members with their JSON types, statuses, error codes
    and headers. This file is normative for those shapes.

    `PROTOCOL.md` in this repository specifies what each one means and every
    check, and the byte formats this file carries opaque (identity documents,
    certificates, prekey statements, passes, signatures and age files) are
    its. A client built from this file alone checks nothing: build to
    `PROTOCOL.md`.

    No server publishes this file. `api/apitest` holds servers to it.

    What every request and answer under `/v1/` shares (`Dromas-Version`,
    `Deprecation`, `Sunset`, `Date`, `Cache-Control`, problem details, the
    JSON rules, unknown members, preconditions, `HEAD` and unknown routes)
    is `PROTOCOL.md` §11.2, §11.3, §11.17, §3.3 and §14.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

security:
  - pass: []

tags:
  - name: server
    description: The server's version policy and the capabilities it serves (`PROTOCOL.md` §11.17, §11.18).
  - name: mailbox
    description: Registering a mailbox, and the read of a mailbox (`PROTOCOL.md` §11.7, §11.8).
  - name: messages
    description: Sending, listing, fetching and acking messages (`PROTOCOL.md` §11.10 to §11.13).
  - name: owner
    description: What a mailbox's owner manages with its pass, its prekey, its ACL and its account (`PROTOCOL.md` §11.9, §11.14, §11.16).
  - name: revocation
    description: Revocations of an address and of its certificates (`PROTOCOL.md` §11.15).
  - name: link
    description: The page a mailbox's link opens (`PROTOCOL.md` §4.3).

paths:
  /v1/:
    parameters:
      - $ref: '#/components/parameters/DromasVersion'
    get:
      tags: [server]
      operationId: getDocument
      summary: The server's version policy and capabilities
      description: The server's document (`PROTOCOL.md` §11.18), the same to every caller. It takes every version.
      security: []
      responses:
        '200':
          description: The server's document.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDocument'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    head:
      tags: [server]
      operationId: headDocument
      summary: The server's document, without content
      description: 'The `GET` beside it, answered without content (RFC 9110 §9.3.2; `PROTOCOL.md` §11.2).'
      security: []
      responses:
        '200':
          description: The server's document, without content.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        '429':
          $ref: '#/components/responses/HeadTooManyRequests'
        '503':
          $ref: '#/components/responses/HeadUnavailable'
  /v1/{addr}:
    parameters:
      - $ref: '#/components/parameters/DromasVersion'
      - $ref: '#/components/parameters/addr'
    get:
      tags: [mailbox]
      operationId: getMailbox
      summary: Everything a sender needs about a mailbox
      description: |
        The read of a mailbox (`PROTOCOL.md` §11.8): its identity document, its
        current prekey statement with its signature, the key types its client
        declared, and the revocation of its certificates this server holds.
      security: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The mailbox, as its identity, or a working key it certified, signed it, and what the server says of its key types.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
            Content-Encoding:
              $ref: '#/components/headers/Content-Encoding'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
        '304':
          description: The target is the one `If-None-Match` named, `*` naming any that exists, and the answer has no content (RFC 9110 §15.4.5).
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
            Vary:
              $ref: '#/components/headers/Vary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: '`revoked`, with the revocation record this server holds in `record`; or `version_retired` (`PROTOCOL.md` §11.17).'
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      status:
                        const: 410
                      code:
                        enum: [revoked, version_retired]
                      record:
                        $ref: '#/components/schemas/RevokedRecord'
                  - if:
                      required: [code]
                      properties:
                        code:
                          const: revoked
                    then:
                      required: [record]
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    head:
      tags: [mailbox]
      operationId: headMailbox
      summary: The read of a mailbox, without content
      description: 'The `GET` beside it, answered without content (RFC 9110 §9.3.2; `PROTOCOL.md` §11.2): the same status and header fields.'
      security: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The mailbox's read, without content.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
            Content-Encoding:
              $ref: '#/components/headers/Content-Encoding'
            Vary:
              $ref: '#/components/headers/Vary'
        '304':
          description: As the `GET`'s `304`.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
            Vary:
              $ref: '#/components/headers/Vary'
        '400':
          $ref: '#/components/responses/HeadRefused'
        '404':
          $ref: '#/components/responses/HeadRefused'
        '410':
          $ref: '#/components/responses/HeadRefused'
        '412':
          $ref: '#/components/responses/HeadRefused'
        '429':
          $ref: '#/components/responses/HeadTooManyRequests'
        '503':
          $ref: '#/components/responses/HeadUnavailable'
    put:
      tags: [mailbox]
      operationId: register
      summary: Register a mailbox
      description: |
        Registers a mailbox (`PROTOCOL.md` §11.7): `201` for a new mailbox, `200` for
        an identical retry. The pass is by the identity, or by the
        certificate of the prekey statement the body brings (`PROTOCOL.md` §8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '201':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/prekey:
    parameters:
      - $ref: '#/components/parameters/DromasVersion'
      - $ref: '#/components/parameters/addr'
    put:
      tags: [owner]
      operationId: renew
      summary: Publish a new prekey
      description: |
        Publishes a new prekey statement (`PROTOCOL.md` §11.9). The pass is
        by the identity, or by the certificate of the new statement
        (`PROTOCOL.md` §8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrekeyRequest'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/revocations:
    parameters:
      - $ref: '#/components/parameters/DromasVersion'
      - $ref: '#/components/parameters/addr'
    get:
      tags: [revocation]
      operationId: revocations
      summary: Read the revocations held
      description: |
        The revocation record the server holds of the address, with a mailbox
        there or none, or `404 not_revoked` (`PROTOCOL.md` §11.15).
      security: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The record held, which names its type.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationRecordAnswer'
        '304':
          description: The target is the one `If-None-Match` named, `*` naming any that exists, and the answer has no content (RFC 9110 §15.4.5).
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/VersionRetired'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    head:
      tags: [revocation]
      operationId: headRevocations
      summary: The read of the revocations held, without content
      description: 'The `GET` beside it, answered without content (RFC 9110 §9.3.2; `PROTOCOL.md` §11.2).'
      security: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The record held, without content.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        '304':
          description: As the `GET`'s `304`.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        '400':
          $ref: '#/components/responses/HeadRefused'
        '404':
          $ref: '#/components/responses/HeadRefused'
        '410':
          $ref: '#/components/responses/HeadRefused'
        '412':
          $ref: '#/components/responses/HeadRefused'
        '429':
          $ref: '#/components/responses/HeadTooManyRequests'
        '503':
          $ref: '#/components/responses/HeadUnavailable'
    put:
      tags: [revocation]
      operationId: revoke
      summary: Publish a revocation
      description: |
        Publishes a revocation record (`PROTOCOL.md` §11.15): `201` for one
        that revokes the address, `200` for one that revokes certificates
        alone. An address already revoked is `410`, carrying the record.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevocationRecord'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '201':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/acl:
    parameters:
      - $ref: '#/components/parameters/DromasVersion'
      - $ref: '#/components/parameters/addr'
    put:
      tags: [owner]
      operationId: putACL
      summary: Replace the mailbox's ACL
      description: |
        The mailbox's ACL, whom the server takes its messages from, replaced whole
        (`PROTOCOL.md` §11.14).
      parameters:
        - name: If-Match
          in: header
          required: false
          description: RFC 9110 §13.1.1's `If-Match`, naming the `ETag` a `GET` answered for the ACL the writer read (`PROTOCOL.md` §11.2, §11.14). A false one is `412`.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: RFC 9110 §13.1.2's `If-None-Match`, evaluated as `PROTOCOL.md` §11.2 and §11.14 say. A false one is `412`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ACLRequest'
      responses:
        '200':
          $ref: '#/components/responses/ACLTaken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [owner]
      operationId: getACL
      summary: The mailbox's ACL
      description: |
        The mailbox's ACL as held, with its `ETag` (`PROTOCOL.md` §11.14). A mailbox
        with none answers `{"allow":["*"],"deny":[]}`.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: RFC 9110 §13.1.1's `If-Match`, evaluated as `PROTOCOL.md` §11.2 says. A false one is `412`.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: RFC 9110 §13.1.2's `If-None-Match`, evaluated as `PROTOCOL.md` §11.2 says. One that names the ACL's tag is `304`.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ACL'
        '304':
          description: The ACL is the one the `If-None-Match` named, and the answer has no content (RFC 9110 §15.4.5).
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Security-Policy:
              $ref: '#/components/headers/Content-Security-Policy'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Referrer-Policy:
              $ref: '#/components/headers/Referrer-Policy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/Cross-Origin-Resource-Policy'
            Cross-Origin-Opener-Policy:
              $ref: '#/components/headers/Cross-Origin-Opener-Policy'
            ETag:
              $ref: '#/components/headers/ACLETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

    head:
      tags: [owner]
      operationId: headACL
      summary: The mailbox's ACL, without content
      description: 'The `GET` beside it, answered without content (RFC 9110 §9.3.2; `PROTOCOL.md` §11.2): its `ETag` among the header fields.'
      parameters:
        - name: If-Match
          in: header
          required: false
          description: As on the `GET`.
          schema:
