    PreconditionFailed:
      description: '`precondition_failed`: an `If-Match` evaluated false (RFC 9110 §13.1.1), or an `If-None-Match` to any method but `GET` and `HEAD` (RFC 9110 §13.1.2), as every route evaluates them (`PROTOCOL.md` §11.2).'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 412
                  code:
                    const: precondition_failed
    ContentTooLarge:
      description: '`too_large`, with the `limit` in bytes, or in entries for an ACL.'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 413
                  code:
                    const: too_large
    TooManyRequests:
      description: |
        Past a limit: `rate_limited` (with `subject`, whom it was counted
        against, and `quota_id`, which limit, from a closed set; a limit
        counted by the day also with its `limit`) · `fetch_paced` ·
        `refetch_spent` · `mailbox_full` (with `count`) · `mailbox_busy`.
        `PROTOCOL.md` §11.3 and §11.5 have what each means.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 429
                  code:
                    enum: [rate_limited, fetch_paced, refetch_spent, mailbox_full, mailbox_busy]
    Unavailable:
      description: '`unavailable`: the server is not ready to answer (`PROTOCOL.md` §11.2).'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
