          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /to/{addr}:
    parameters:
      - name: addr
        in: path
        required: true
        description: A mailbox's address, 77 characters of lowercase base32. Any other path is `404`.
        schema:
          $ref: '#/components/schemas/Address'
    get:
      tags: [link]
      operationId: link
      summary: The page a mailbox's link opens
      description: |
        The page at a mailbox's link (`PROTOCOL.md` §4.3): fixed text, the address
        and this server's link to it. A query on the link is ignored.
      security: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The page.
          headers:
            Referrer-Policy:
              required: true
              schema:
                const: no-referrer
            X-Robots-Tag:
              required: true
              schema:
                const: noindex
            Content-Security-Policy:
              description: The reference server's, which lets the page run nothing and allows its one style element by its hash, no inline style else.
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                const: nosniff
            Cross-Origin-Resource-Policy:
              schema:
                const: same-origin
            Cross-Origin-Opener-Policy:
              schema:
                const: same-origin
            Cache-Control:
              description: How long a cache may keep the page; it is the same for every request.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '304':
          description: The page exists for every address, so `If-None-Match` is false only as `*`, and the answer has no content (RFC 9110 §15.4.5).
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              description: How long a cache may keep the page, as on its `200`.
              required: true
              schema:
                type: string
        '404':
          description: Not an address.
          content:
            text/plain:
              schema:
                type: string
        '412':
          description: '`precondition_failed`: an `If-Match` that lists a tag, which the page carries none of (`PROTOCOL.md` §11.2).'
          headers:
            Date:
              $ref: '#/components/headers/Date'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      status:
                        const: 412
                      code:
                        const: precondition_failed
        '429':
          description: '`rate_limited`: past a limit counted against the IP address the request comes from (`PROTOCOL.md` §11.5).'
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      status:
                        const: 429
                      code:
                        const: rate_limited

    head:
      tags: [link]
      operationId: headLink
      summary: The page a mailbox's link opens, without content
      description: 'The `GET` beside it, answered without content (RFC 9110 §9.3.2; `PROTOCOL.md` §11.2).'
      security: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The page, without content.
          headers:
            Referrer-Policy:
              required: true
              schema:
                const: no-referrer
            X-Robots-Tag:
              required: true
              schema:
                const: noindex
            Content-Security-Policy:
              description: As on the `GET`.
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                const: nosniff
            Cross-Origin-Resource-Policy:
              schema:
                const: same-origin
            Cross-Origin-Opener-Policy:
              schema:
                const: same-origin
            Cache-Control:
              description: As on the `GET`.
              schema:
                type: string
        '304':
          description: As the `GET`'s `304`.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              description: As on the `GET`'s `304`.
              required: true
              schema:
                type: string
        '404':
          description: Not an address, without content.
        '412':
          description: '`precondition_failed`, as on the `GET`, without content.'
          headers:
            Date:
              $ref: '#/components/headers/Date'
        '429':
          description: '`rate_limited`, as on the `GET`, without content.'
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Retry-After:
              $ref: '#/components/headers/Retry-After'

components:
  securitySchemes:
    pass:
      type: http
      scheme: dromas-pass
      description: |
        A pass the mailbox signs for itself with its signer, its identity or
        a working key it certified (`PROTOCOL.md` §5, §8). A client writes it in exactly this form:
        `Authorization: dromas-pass address="<address>", not_after="<RFC 3339 UTC>", signature="<base64 of the SSHSIG>"`.
        A server reads it as RFC 9110 §11 lets a recipient: the scheme and
        the names in any case, the three parameters in any order, whitespace
        around each comma and `=`, each value a token or a quoted-string. A
        `401` carries `WWW-Authenticate: dromas-pass`.

  parameters:
    DromasVersion:
      name: Dromas-Version
      in: header
      required: false
      description: The version of the client that makes the request, SemVer's `MAJOR.MINOR.PATCH` and an optional pre-release, with no `v` and no build metadata (`PROTOCOL.md` §11.17). Every client sends it; a request without it, or with a value of another form, is read as `0.0.0`.
      schema:
        type: string
    addr:
      name: addr
      in: path
      required: true
      description: A mailbox's address, 77 characters of lowercase base32 (`PROTOCOL.md` §4.2). Any other form, uppercase among them, is `400 bad_address`.
      schema:
        $ref: '#/components/schemas/Address'
    id:
      name: id
      in: path
      required: true
      description: A message id, the lowercase hex SHA-256 of its ciphertext. Any other form is `404 no_such_message`.
      schema:
        $ref: '#/components/schemas/MessageID'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: RFC 9110 §13.1.1's `If-Match`, evaluated as `PROTOCOL.md` §11.2 says, at the point §11.4 places it. A false one is `412`.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: RFC 9110 §13.1.2's `If-None-Match`, evaluated as `PROTOCOL.md` §11.2 says, at the point §11.4 places it. A false one is `304` to a `GET` or a `HEAD`, and `412` to any other method.
      schema:
        type: string

  headers:
    Deprecation:
      description: 'RFC 9745''s `Deprecation`, a Structured Field Date (RFC 9651 §3.3.7): `@` and the Unix time from which the server deems the version the request names deprecated, on every answer under `/v1/` to a version a deprecation covers (`PROTOCOL.md` §11.17).'
      required: false
      schema:
        type: string
        pattern: '^@-?[0-9]{1,15}$'
    Sunset:
      description: RFC 8594's `Sunset`, an HTTP-date (RFC 9110 §5.6.7) from which the server stops taking the version the request names, on every answer under `/v1/` to a version a sunset covers (`PROTOCOL.md` §11.17).
      required: false
      schema:
        type: string
    Date:
      description: The time by the clock the server's checks read (`PROTOCOL.md` §11.2).
      required: true
      schema:
        type: string
    Cache-Control:
      description: '`no-store`, on every answer under `/v1/` (`PROTOCOL.md` §11.2).'
      required: true
      schema:
        const: no-store
    Content-Security-Policy:
      description: For a browser, on every answer under `/v1/`, which is never a page - render nothing it names, frame it nowhere. A client ignores it.
      required: false
      schema:
        const: "default-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options:
      description: For a browser, on every answer under `/v1/` - never sniff its type. A client ignores it.
      required: false
      schema:
        const: nosniff
    Referrer-Policy:
      description: For a browser, on every answer under `/v1/` - send no Referer from it. A client ignores it.
      required: false
      schema:
        const: no-referrer
    Cross-Origin-Resource-Policy:
      description: For a browser, on every answer under `/v1/` - no other origin loads it. A client ignores it.
      required: false
      schema:
        const: same-origin
    Cross-Origin-Opener-Policy:
      description: For a browser, on every answer under `/v1/` - nothing of another origin opens it. A client ignores it.
      required: false
      schema:
        const: same-origin
    Content-Encoding:
      description: '`gzip`, only to a request whose `Accept-Encoding` takes it (RFC 9110 §8.4.1.3, §12.5.3; `PROTOCOL.md` §11.2). The answer is the JSON beneath.'
      required: false
      schema:
        const: gzip
    Vary:
      description: '`Accept-Encoding`, on an answer a server may compress, gzip or not (RFC 9110 §12.5.5).'
      required: false
      schema:
        const: Accept-Encoding
    Retry-After:
      description: How many seconds to wait before trying again, in digits alone (RFC 9110 §10.2.3's delay-seconds; never an HTTP-date, `PROTOCOL.md` §11.3).
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    PollInterval:
      description: A list's `Retry-After`, on every list answer, a `304` among them - the server's poll interval in seconds, in digits alone, as RFC 9773 §4.3 uses the field (`PROTOCOL.md` §11.11).
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    ETag:
      description: A first page's entity tag (RFC 9110 §8.8.3), opaque; a page after the first has none (`PROTOCOL.md` §11.11).
      required: false
      schema:
        type: string
    ACLETag:
      description: A strong entity tag of the ACL as held (RFC 9110 §8.8.3), opaque. Only a `GET` carries it (`PROTOCOL.md` §11.14).
      required: true
      schema:
        type: string
        pattern: '^"[\x21\x23-\x7e]*"$'
    WWW-Authenticate:
      description: The scheme a call must use, `dromas-pass`, with any auth-params a server adds (RFC 9110 §11.6.1).
      required: true
      schema:
        type: string
        pattern: '^dromas-pass( .*)?$'
    Location:
      description: The message the send made, `/v1/<recipient>/messages/<id>` (RFC 9110 §15.3.2).
      required: true
      schema:
        type: string
        pattern: '^/v1/[a-z2-7]{76}[acegikmoqsuwy246]/messages/[0-9a-f]{64}$'

  responses:
    Done:
      description: Done. The body is an empty object.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Empty'
    NoContent:
      description: Done.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
    ACL:
      description: The ACL as held, `*` first, then each address once, in ascending order of its 48 bytes, with its tag.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        ETag:
          $ref: '#/components/headers/ACLETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ACL'
    ACLTaken:
      description: The ACL as held once the `PUT` took it, `*` first, then each address once, in ascending order of its 48 bytes. No `ETag` (RFC 9110 §9.3.4; `PROTOCOL.md` §11.14).
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ACL'
    BadRequest:
      description: |
        Not a request this call takes: `bad_request` (naming what is wrong in
        `member`) · `bad_address` · `bad_encoding` · `identity_mismatch` ·
        `unsupported_key_type` (with the server's `key_types`) · `bad_key` ·
        `prekey_not_new` · `prekey_time` · `certificate_too_long` (with the
        server's `max_certificate_lifetime`) · `not_age` ·
        `wrong_recipient_type` · `bad_revocation`. `PROTOCOL.md` §11.3 has what
        each means.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 400
                  code:
                    enum: [bad_request, bad_address, bad_encoding, identity_mismatch, unsupported_key_type, bad_key, prekey_not_new, prekey_time, certificate_too_long, not_age, wrong_recipient_type, bad_revocation]
    Unauthorized:
      description: |
        The pass is refused: `unauthorized` · `pass_expired` ·
        `certificate_not_current` (with `certificate_serial` where the signer
        it names is a certificate) ·
        `certificate_revoked`. `PROTOCOL.md` §8 has what each means.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 401
                  code:
                    enum: [unauthorized, pass_expired, certificate_not_current, certificate_revoked]
    Forbidden:
      description: |
        `unknown_sender` · `sender_revoked` · `sender_not_allowed` ·
        `sender_key_type` (with the sender's `key_type`) ·
        `adopt_key_refused`. `PROTOCOL.md` §11.3 has what each means.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 403
                  code:
                    enum: [unknown_sender, sender_revoked, sender_not_allowed, sender_key_type, adopt_key_refused]
    NotFound:
      description: |
        `no_such_mailbox` · `no_such_message` · `not_revoked` (only on the
        read of the revocations held, `PROTOCOL.md` §11.15). `PROTOCOL.md`
        §11.3 has what each means.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 404
                  code:
                    enum: [no_such_mailbox, no_such_message, not_revoked]
    Conflict:
      description: |
        `conflict` (with `prekey_serial`, and `certificate_serial` where the
        current signer is a certificate, or `through`, as the call has one) ·
        `mailbox_changed` · `stale_prekey` · `prekey_expired`.
        `PROTOCOL.md` §11.3 has what each means.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 409
                  code:
                    enum: [conflict, mailbox_changed, stale_prekey, prekey_expired]
    Gone:
      description: |
        `revoked`. Every `410 revoked` a server answers from the record it
        holds carries that record in `record` (`PROTOCOL.md` §11.3, §12.5).
        Or `version_retired`, with `min_version` where the server sets a
        floor (`PROTOCOL.md` §11.17).
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 410
                  code:
                    enum: [revoked, version_retired]
                  record:
                    $ref: '#/components/schemas/RevokedRecord'
    VersionRetired:
      description: '`version_retired`, with `min_version` where the server sets a floor: the server no longer takes the version the request names (`PROTOCOL.md` §11.17, §11.4 rule 0).'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 410
                  code:
                    const: version_retired
    RequestTimeout:
      description: '`request_timeout`: the body did not arrive in the time the server waits for it (RFC 9110 §15.5.9; `PROTOCOL.md` §11.2).'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
      content:
