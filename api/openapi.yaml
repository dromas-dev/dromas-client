        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
    HeadTooManyRequests:
      description: 'Past a limit, as on the `GET` beside it, without content.'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
    HeadUnavailable:
      description: 'As the `GET` beside it is answered while the server is not ready, without content.'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Content-Security-Policy:
          $ref: '#/components/headers/Content-Security-Policy'
        X-Content-Type-Options:
          $ref: '#/components/headers/X-Content-Type-Options'
        Referrer-Policy:
          $ref: '#/components/headers/Referrer-Policy'
        Cross-Origin-Resource-Policy:
          $ref: '#/components/headers/Cross-Origin-Resource-Policy'
        Cross-Origin-Opener-Policy:
          $ref: '#/components/headers/Cross-Origin-Opener-Policy'
        Retry-After:
          $ref: '#/components/headers/Retry-After'

  schemas:
    PolicyVersion:
      description: A version as a server's policy writes one, `MAJOR.MINOR` or `MAJOR.MINOR.PATCH` (`PROTOCOL.md` §11.17).
      type: string
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$'
    Scheduled:
      description: A deprecation or a sunset of the versions `below` or `version` names, exactly one of the two, from `at` (`PROTOCOL.md` §11.17, §11.18).
      type: object
      required: [at]
      properties:
        below:
          $ref: '#/components/schemas/PolicyVersion'
        version:
          $ref: '#/components/schemas/PolicyVersion'
        at:
          $ref: '#/components/schemas/Time'
      oneOf:
        - required: [below]
        - required: [version]
    Capability:
      description: A capability of version 1 the server serves (`PROTOCOL.md` §11.18).
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
    ServerDocument:
      description: The server's version policy and the capabilities it serves (`PROTOCOL.md` §11.18).
      type: object
      required: [deprecations, sunsets, capabilities, max_certificate_lifetime]
      properties:
        max_certificate_lifetime:
          description: The longest a certificate this server takes may run, `valid before` less `valid after`, in seconds (`PROTOCOL.md` §11.7, §11.18).
          type: integer
          minimum: 1
          maximum: 9007199254740991
        min_version:
          $ref: '#/components/schemas/PolicyVersion'
        latest_version:
          $ref: '#/components/schemas/PolicyVersion'
        deprecations:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Scheduled'
        sunsets:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Scheduled'
        capabilities:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Capability'
    Integer:
      description: An integer in digits alone, from 0 to 2^53 − 1 (`PROTOCOL.md` §3.3).
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Time:
      description: RFC 3339 UTC to the second (`PROTOCOL.md` §2.2).
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
    Address:
      description: A mailbox's address, the SHA-384 of its identity document in base32 (RFC 4648 §6), lowercase and without padding, 77 characters, the last with its unused bit zero (`PROTOCOL.md` §4.2).
      type: string
      pattern: '^[a-z2-7]{76}[acegikmoqsuwy246]$'
    MessageID:
      description: A message id, the lowercase hex SHA-256 of its ciphertext.
      type: string
      pattern: '^[0-9a-f]{64}$'
    Bytes:
      description: |
        A file's exact bytes, as standard base64 in its one encoding (RFC 4648
        §4): padded, no line break, the unused bits of the last character zero
        (`PROTOCOL.md` §2.2, §3.3).
      type: string
      contentEncoding: base64
      pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
    KeyTypes:
      description: |
        The identity key types the mailbox's client verifies (`PROTOCOL.md` §7):
        key type names, or the one entry `any`.
      type: [array, 'null']
      items:
        type: string
    Empty:
      description: '`{}`.'
      type: object

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [identity, prekey, prekey_signature]
      properties:
        identity:
          description: The identity document (`PROTOCOL.md` §4.1).
          $ref: '#/components/schemas/Bytes'
        prekey:
          description: The first prekey statement (`PROTOCOL.md` §6).
          $ref: '#/components/schemas/Bytes'
        prekey_signature:
          description: The statement's SSHSIG, armored, by the identity or by a working key under a certificate of it (`PROTOCOL.md` §3.2, §5).
          $ref: '#/components/schemas/Bytes'
        sender_key_types:
          $ref: '#/components/schemas/KeyTypes'
    PrekeyRequest:
      type: object
      additionalProperties: false
      required: [prekey, prekey_signature]
      properties:
        prekey:
          description: The new prekey statement (`PROTOCOL.md` §6).
          $ref: '#/components/schemas/Bytes'
        prekey_signature:
          description: Its SSHSIG, armored, by the identity or by a working key under a certificate of it (`PROTOCOL.md` §5).
          $ref: '#/components/schemas/Bytes'
        sender_key_types:
          $ref: '#/components/schemas/KeyTypes'
    MailboxResponse:
      description: |
        The read of a mailbox (`PROTOCOL.md` §11.8).
      type: object
      required: [identity, prekey, prekey_signature]
      dependentRequired:
        revoked_certificates: [revoked_certificates_signature]
        revoked_certificates_signature: [revoked_certificates]
      properties:
        identity:
          description: The identity document (`PROTOCOL.md` §4.1).
          $ref: '#/components/schemas/Bytes'
        prekey:
          description: The current prekey statement.
          $ref: '#/components/schemas/Bytes'
        prekey_signature:
          description: Its SSHSIG, armored, carrying its signer, the identity key or a certificate (`PROTOCOL.md` §5).
          $ref: '#/components/schemas/Bytes'
        sender_key_types:
          $ref: '#/components/schemas/KeyTypes'
        revoked_certificates:
          description: The identity's revocation of its certificates through a serial, when this server holds one (`PROTOCOL.md` §10.2), as a record carries it (§10.3).
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
        revoked_certificates_signature:
          description: The identity's SSHSIG over that statement, armored.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
    StatementHash:
      description: The lowercase hex SHA-256 of a prekey statement's bytes (`PROTOCOL.md` §11.10).
      type: string
      pattern: '^[0-9a-f]{64}$'
    Cursor:
      description: A list's cursor, opaque and URL-safe (`PROTOCOL.md` §11.11).
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
    Wait:
      description: A long poll's wait, delay-seconds in digits alone (`PROTOCOL.md` §11.11).
      type: string
      pattern: '^[0-9]+$'
    Receipt:
      type: object
      required: [id, received_at, expires_at]
      properties:
        id:
          description: The SHA-256 of the ciphertext.
          $ref: '#/components/schemas/MessageID'
        received_at:
          $ref: '#/components/schemas/Time'
        expires_at:
          description: When the server deletes the message, read or not (`PROTOCOL.md` §13).
          $ref: '#/components/schemas/Time'
    MessageList:
      type: object
      required: [count, messages, next_cursor]
      properties:
        count:
          description: Every live message in the mailbox.
          $ref: '#/components/schemas/Integer'
        messages:
          description: One page, oldest first by `received_at`.
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MessageInfo'
        next_cursor:
          description: The next page's cursor; null on the last page (`PROTOCOL.md` §11.11).
          anyOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
    MessageInfo:
      type: object
      required: [id, size, received_at, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/MessageID'
        size:
          description: The ciphertext's size in bytes, which its fetch answers exactly, at most 16 MiB (`PROTOCOL.md` §11.10).
          $ref: '#/components/schemas/Integer'
          maximum: 16777216
        received_at:
          $ref: '#/components/schemas/Time'
        expires_at:
          $ref: '#/components/schemas/Time'
    RevocationRecord:
      description: |
        A revocation record (`PROTOCOL.md` §10.3): a revocation of the
        address, of its certificates through a serial, or both.
      type: object
      additionalProperties: false
      required: [identity]
      anyOf:
        - required: [revocation_signature]
        - required: [revoked_certificates]
      dependentRequired:
        revoked_certificates: [revoked_certificates_signature]
        revoked_certificates_signature: [revoked_certificates]
      properties:
        type:
          enum: [revocation_record, null]
        identity:
          description: The identity document.
          $ref: '#/components/schemas/Bytes'
        revocation_signature:
          description: The identity's SSHSIG over `dromas-revoke-v1\n<address>\n`, armored.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
        revoked_certificates:
          description: The statement `dromas-revoke-certs-v1\n<address>\n<serial>\n`.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
        revoked_certificates_signature:
          description: The identity's SSHSIG over that statement, armored.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
    RevocationRecordAnswer:
      description: A record as a server serves it, which names its type, in no set order among its members.
      allOf:
        - $ref: '#/components/schemas/RevocationRecord'
        - required: [type]
          properties:
            type:
              const: revocation_record
    RevokedRecord:
      description: |
        The record a `410 revoked` carries (`PROTOCOL.md` §10.3): on the read
        of a mailbox always, and on any other call's where the server answers from
        it. It holds the revocation of the address always, and the revocation
        of its certificates when the server holds one.
      type: object
      required: [type, identity, revocation_signature]
      dependentRequired:
        revoked_certificates: [revoked_certificates_signature]
        revoked_certificates_signature: [revoked_certificates]
      properties:
        type:
          const: revocation_record
        identity:
          description: The identity document.
          $ref: '#/components/schemas/Bytes'
        revocation_signature:
          description: The identity's SSHSIG over `dromas-revoke-v1\n<address>\n`, armored.
          $ref: '#/components/schemas/Bytes'
        revoked_certificates:
          description: The statement `dromas-revoke-certs-v1\n<address>\n<serial>\n`.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
        revoked_certificates_signature:
          description: The identity's SSHSIG over that statement, armored.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
    ACLRequest:
      type: object
      additionalProperties: false
      required: [allow]
      properties:
        allow:
          description: '`["*"]` is everyone, `[]` nobody (`PROTOCOL.md` §11.14).'
          type: array
          items:
            $ref: '#/components/schemas/ACLEntry'
        deny:
          description: Left out or null, none (`PROTOCOL.md` §11.14).
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ACLEntry'
    ACL:
      description: At most 10,000 entries in both lists together (`PROTOCOL.md` §11.14).
      type: object
      required: [allow, deny]
      properties:
        allow:
          type: array
          items:
            $ref: '#/components/schemas/ACLEntry'
        deny:
          type: array
          items:
            $ref: '#/components/schemas/ACLEntry'
    ACLEntry:
      description: An address, or `*`, which matches every address.
      type: string
      pattern: '^(\*|[a-z2-7]{76}[acegikmoqsuwy246])$'
    AdoptRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          description: An adopt key (`PROTOCOL.md` §11.16). A secret.
          type: string
          pattern: '^dra1_[A-Za-z0-9_-]+$'
          maxLength: 1024
    AccountResponse:
      type: object
      required: [account]
      properties:
        account:
          description: The account's id, 1 to 32 of `a-z`, `0-9` and `-`.
          type: string
          pattern: '^[a-z0-9-]{1,32}$'

    Problem:
      description: |
        An error body: RFC 9457 Problem Details in AEP-193's form, with a
        member of its own for each value the error carries (`PROTOCOL.md`
        §11.3).
      type: object
      required: [type, title, status, code]
      properties:
        type:
          description: '`tag:dromas.dev,2026-10-26:errors/<code>`, the code''s own, the same at every server (RFC 4151; `PROTOCOL.md` §11.3).'
          type: string
          pattern: '^tag:dromas\.dev,2026-10-26:errors/[a-z_]+$'
        title:
          type: string
        status:
          $ref: '#/components/schemas/Integer'
        detail:
          type: [string, 'null']
        code:
          description: One of the closed list under this status (`PROTOCOL.md` §11.3).
          type: string
        hint:
          description: The fix as a client command, never a raw shell line.
          type: [string, 'null']
        limit:
          description: '`too_large`: the most bytes a body or a ciphertext may hold, or entries an ACL. `rate_limited` with a quota counted by the day: how many a day it takes.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        quota_id:
          description: '`rate_limited`: which limit, from this closed set (`PROTOCOL.md` §11.5). A limit of a server''s own outside it names none.'
          type: [string, 'null']
          enum: [polls, pages, calls, sends, renewals, certificates, certificate_revocations, registrations, registrations_range, misses, sends_before_pass, requests, null]
        subject:
          description: '`rate_limited`: whom the limit counted the call against, the mailbox or the IP address it came from (`PROTOCOL.md` §11.5).'
          type: [string, 'null']
          enum: [mailbox, ip, null]
        count:
          description: '`mailbox_full`: how many messages the mailbox holds, as its list counts them.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        prekey_serial:
          description: '`conflict` on a prekey: the serial a new one must be above.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        certificate_serial:
          description: '`conflict` on a prekey: the current certificate''s serial, where the current signer is a certificate; `certificate_not_current`: the serial of the certificate the call takes a pass by, or of the one a new statement must be above, where that is a certificate (`PROTOCOL.md` §8).'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        max_certificate_lifetime:
          description: '`certificate_too_long`: the longest a certificate the server takes may run, in seconds, as its document gives it (`PROTOCOL.md` §11.18).'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        through:
          description: '`conflict` on a revocation of certificates: the serial the one held runs through.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        key_types:
          description: '`unsupported_key_type`: the identity key types the server registers.'
          type: [array, 'null']
          items:
            type: string
        key_type:
          description: '`sender_key_type`: the sender''s key type, which the mailbox''s client does not verify.'
          type: [string, 'null']
        member:
          description: '`bad_request`: the request member or query parameter that is missing, unknown or given twice, or holds a value its call does not take.'
          type: [string, 'null']
        min_version:
          description: '`version_retired`: the lowest version the server takes, where it sets a floor, `MAJOR.MINOR` or `MAJOR.MINOR.PATCH` (`PROTOCOL.md` §11.17).'
          type: [string, 'null']
        record:
          description: '`revoked`: the revocation record the server holds (`PROTOCOL.md` §10.3), on the read of a mailbox always and on any other call where the server answers from it.'
          anyOf:
            - $ref: '#/components/schemas/RevokedRecord'
            - type: 'null'
      allOf:
        - if:
            required: [code]
            properties:
              code:
                const: too_large
          then:
            required: [limit]
        - if:
            required: [code]
            properties:
              code:
                const: rate_limited
          then:
            required: [subject]
        - if:
            required: [quota_id]
            properties:
              quota_id:
                enum: [sends, renewals, certificates, certificate_revocations]
          then:
            required: [limit]
        - if:
            required: [code]
            properties:
              code:
                const: mailbox_full
          then:
            required: [count]
        - if:
            required: [code]
            properties:
              code:
                const: certificate_too_long
          then:
            required: [max_certificate_lifetime]
        - if:
            required: [code]
            properties:
              code:
                const: unsupported_key_type
          then:
            required: [key_types]
        - if:
            required: [code]
            properties:
              code:
                const: sender_key_type
          then:
            required: [key_type]
        - if:
            required: [quota_id]
            properties:
              quota_id:
                enum: [polls, pages, calls, sends, renewals, certificates, certificate_revocations]
          then:
            properties:
              subject:
                const: mailbox
        - if:
            required: [quota_id]
            properties:
              quota_id:
                enum: [registrations, registrations_range, misses, sends_before_pass, requests]
          then:
            properties:
              subject:
                const: ip
