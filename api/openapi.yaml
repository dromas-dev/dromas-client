        '206':
          description: The bytes of the age file from the range's first to its end, to a fetch whose `Range` is `bytes=N-` with N below its length (RFC 9110 §15.3.7.1).
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Deprecation:
