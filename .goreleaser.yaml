# The dromas command's releases, which .github/workflows/release.yml makes
# from a signed tag: a static binary for each system and architecture below,
# archived with the licence and README, a .deb, .rpm and .apk of each Linux
# build, an SBOM of each archive, and
# checksums.txt, signed with cosign, whose files the workflow attests; and
# the winget and Nix packages made from those archives. Built
# from the tagged module as Go's module proxy serves it (gomod.proxy), so a
# release is what go install …@<tag> builds, and with GoReleaser's settings
# for a reproducible build.
# The BSDs on amd64 alone, the architecture CI runs them on. goreleaser
# release --snapshot --clean builds it all into dist/ and publishes nothing.
version: 2

project_name: dromas

gomod:
  proxy: true

builds:
  - id: dromas
    main: ./cmd/dromas
    binary: dromas
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd, openbsd, netbsd, dragonfly]
    goarch: [amd64, arm64]
    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: openbsd
        goarch: arm64
      - goos: netbsd
        goarch: arm64
      - goos: dragonfly
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info: &info
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *info
      - src: README.md
        info: *info
      # Each service template, in the archives of its systems alone
      # (docs/guide.md § Run as a service): the path is empty for any other
      # system, which adds nothing. The rc.d scripts keep their mode, 0755.
      - src: '{{ if eq .Os "linux" }}packaging/systemd/dromas@.service{{ end }}'
        info: *info
      - src: '{{ if eq .Os "darwin" }}packaging/launchd/dev.dromas.recv.plist{{ end }}'
        info: *info
      - src: '{{ if or (eq .Os "freebsd") (eq .Os "dragonfly") }}packaging/rc.d/freebsd/dromas{{ end }}'
        info: *info
      - src: '{{ if eq .Os "netbsd" }}packaging/rc.d/netbsd/dromas{{ end }}'
        info: *info
      - src: '{{ if eq .Os "openbsd" }}packaging/rc.d/openbsd/dromas{{ end }}'
        info: *info

# A .deb, .rpm and .apk of each Linux build, by nFPM through GoReleaser: the
# binary in /usr/bin, a user service that nothing enables (the systemd user
# template in the .deb and .rpm, the OpenRC user service in the .apk, as
# Alpine's own packages ship one in /etc/user/init.d), and the licence and
# README. Dated by the commit, as the archives are, so a rebuild makes the
# same bytes.
nfpms:
  - formats: [deb, rpm, apk]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Dromas
    homepage: https://dromas.dev
    maintainer: Drew Streib <dtype@dtype.org>
    description: The dromas command, a client of Dromas, end-to-end encrypted mailboxes for bots.
    license: Apache-2.0
    section: net
    mtime: "{{ .CommitDate }}"
    # An rpm's header names the host that built it, nFPM's own hostname by
    # default: one name for every build, so the rebuild matches.
    rpm:
      buildhost: localhost
    contents:
      - src: packaging/systemd/dromas@.service
        dst: /usr/lib/systemd/user/dromas@.service
        packager: deb
        file_info: &pkg
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: packaging/systemd/dromas@.service
        dst: /usr/lib/systemd/user/dromas@.service
        packager: rpm
        file_info: *pkg
      - src: packaging/openrc/dromas
        dst: /etc/user/init.d/dromas
        packager: apk
        file_info:
          mode: 0755
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        dst: /usr/share/doc/dromas/LICENSE
        file_info: *pkg
      - src: README.md
        dst: /usr/share/doc/dromas/README.md
        file_info: *pkg

# The Windows zips as a winget package, Dromas.dromas, by GoReleaser's winget
# pipe as Smallstep, Charm and chezmoi publish theirs: on a release tag it
# writes the manifests to dromas-dev/winget-pkgs, a fork, and opens the pull
# request to microsoft/winget-pkgs, whose validation and review publish it.
# A classic token, WINGET_GITHUB_TOKEN, opens it: a fine-grained one cannot
# contribute to a repository its owner is not a member of (GitHub's
# personal-access-token docs). A snapshot writes the manifests to dist/ alone.
winget:
  - name: dromas
    publisher: Dromas
    publisher_url: https://dromas.dev
    publisher_support_url: https://github.com/dromas-dev/dromas-client/issues
    package_identifier: Dromas.dromas
    short_description: The dromas command, a client of Dromas, end-to-end encrypted mailboxes for bots.
    license: Apache-2.0
    license_url: https://github.com/dromas-dev/dromas-client/blob/main/LICENSE
    homepage: https://dromas.dev
    release_notes_url: https://github.com/dromas-dev/dromas-client/releases/tag/{{ .Tag }}
    tags:
      - cli
      - encryption
      - messaging
      - bots
    skip_upload: auto
    commit_author:
      name: Drew Streib
      email: dtype@dtype.org
    commit_msg_template: "New version: {{ .PackageIdentifier }} version {{ .Version }}"
    repository:
      owner: dromas-dev
      name: winget-pkgs
      branch: "dromas-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# The Linux and macOS archives as a Nix package in the Nix User Repository
# dromas-dev/nur, by GoReleaser's nix pipe, as GoReleaser publishes its own
# (goreleaser/nur): on a release tag it commits pkgs/dromas/default.nix there
# with WINGET_GITHUB_TOKEN, whose public_repo scope reaches that public
# repository (the organisation allows no deploy keys). A snapshot writes the
# file to dist/ alone.
nix:
  - name: dromas
    homepage: https://dromas.dev
    description: The dromas command, a client of Dromas, end-to-end encrypted mailboxes for bots.
    license: asl20
    main_program: dromas
    skip_upload: auto
    commit_author:
      name: Drew Streib
      email: dtype@dtype.org
    commit_msg_template: "dromas: {{ .Tag }}"
    repository:
      owner: dromas-dev
      name: nur
      branch: main
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
    extra_install: |
      install -Dm644 ./LICENSE $out/share/doc/dromas/LICENSE
      install -Dm644 ./README.md $out/share/doc/dromas/README.md

checksum:
  name_template: checksums.txt

# checksums.txt signed with cosign, keyless, as GoReleaser documents it
# (customization/sign): checksums.txt.sigstore.json, made by the release
# workflow's own identity.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# An SPDX document of each archive, by syft, with GoReleaser's own arguments,
# named as OpenSSF Scorecard looks for one. checksums.txt names each, so its
# signature and the attestations cover them.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

# Each commit since the last tag, with its link, as GoReleaser lists its own.
changelog:
  use: github
  sort: asc

# The notes open with the signed tag's message past its first line (empty
# for a plain patch) and close with how to check what was downloaded.
release:
  header: "{{ .TagBody }}"
  footer: |
    ## Verify

    Built from the signed tag {{ .Tag }} by this repository's release workflow. With gh 2.102.0 or later:

    ```sh
    gh release verify-asset {{ .Tag }} <file> -R dromas-dev/dromas-client
    gh attestation verify <file> -R dromas-dev/dromas-client --signer-workflow dromas-dev/dromas-client/.github/workflows/release.yml --source-ref refs/tags/{{ .Tag }}
    ```

    Or with cosign: `docs/install/verify.md`.
